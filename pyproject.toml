[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinformatics-core-toolkit"
version = "0.1.0"
description = "From-scratch Python implementations of core DNA operations: GC content, transcription, reverse complement, translation, FASTA parsing and substitution detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ishitta Sarkar" }]
keywords = [
    "bioinformatics",
    "dna",
    "fasta",
    "sequence-analysis",
    "learning-project",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "biopython==1.88",
    "numpy==2.2.6",
    "ruff==0.17.6",
]

[project.urls]
Homepage = "https://github.com/Ishitta-Sarkar/bioinformatics-core-toolkit"
Repository = "https://github.com/Ishitta-Sarkar/bioinformatics-core-toolkit"
Changelog = "https://github.com/Ishitta-Sarkar/bioinformatics-core-toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["."]
# Keep hand-aligned examples in the documentation.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
